services:
  # Backend API service (Go/Gin)
  - type: web
    name: bus-booking-api
    runtime: docker
    dockerfilePath: ./BE-bus-booking-platform/Dockerfile
    dockerContext: ./BE-bus-booking-platform
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: bus-booking-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: "15m"
      - key: REFRESH_EXPIRY
        value: "168h"
      - key: RATE_LIMIT_REQUESTS
        value: "20"
      - key: RATE_LIMIT_WINDOW
        value: "1m"
      - key: SMTP_HOST
        value: "smtp.mailtrap.io"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: "noreply@busbooking.com"
      - key: AWS_BUCKET
        sync: false
      - key: AWS_REGION
        value: "us-east-1"
      - key: APP_URL
        value: "https://bus-booking-platform.onrender.com"
      - key: CORS_ALLOWED_ORIGIN
        value: "https://bus-booking-platform.onrender.com"
      - key: FLEXPAY_BASE_URL
        value: "https://backend.flexpay.cd"
      - key: FLEXPAY_AUTHORIZATION
        sync: false
      - key: FLEXPAY_MERCHANT
        value: "KIVUGC"

  # Frontend service (React/Vite/Nginx)
  - type: web
    name: bus-booking-platform
    runtime: docker
    dockerfilePath: ./FE-bus-booking-platform/Dockerfile
    dockerContext: ./FE-bus-booking-platform
    plan: free
    region: frankfurt
    healthCheckPath: /
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: VITE_API_URL
        value: "https://bus-booking-api.onrender.com"

# NOTE: Database section REMOVED to avoid creating new database.
# The existing PostgreSQL database "bus-booking-db" must be manually linked in Render Dashboard:
# 1. Go to Render Dashboard → Blueprints → Connect Repository
# 2. When prompted, select "Use existing database" for bus-booking-db
# 3. Or create the database separately first, then reference it by name in fromDatabase above